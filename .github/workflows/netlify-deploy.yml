name: Netlify-Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.github/**'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 16.x
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: GATSBY_CPU_COUNT=2 NODE_OPTIONS="--max-old-space-size=8192" yarn build
        env:
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}

      # rsync 
      - name: rsync deployments to hlc1
        uses: burnett01/rsync-deployments@5.1
        with:
          # 「switches: -avzr --delete」だと、実行はできても戻り値がエラーになる。
          # １．--omit-dir-timesで「failed to set times onエラー」は防止可。
          # ２．-aオプションは-rlptgoDと等価、うちpgoDがWEBサーバのオーナ設定によっては問題になる。 
          switches: -rlOtcv --delete --exclude=".htaccess"
          path: public/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      # Netlifyにデプロイ。「--prod」を付けないとプレビューDeployになるので注意。
      - name: deployments to Netlify
        run: npx netlify-cli deploy --prod --dir=./public
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
