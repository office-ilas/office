name: Netlify-Deploy

on:
  push:
    branches:
      - main
  #pull_request:
  #  types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v1
        with:
          node-version: 16.x
      - run: yarn install
      - run: yarn build

      # Netlifyにデプロイ。「--prod」を付けないとプレビューDeployになるので注意。
      #- run: npx netlify-cli deploy --prod --dir=./public
      #  env:
      #    NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #    NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # rsync 
      - name: rsync deployments to hlc1
        uses: burnett01/rsync-deployments@5.1
        with:
          # --omit-dir-timesは「failed to set times onエラー」防止のため。 
          #switches: -avzr --delete --omit-dir-times
          switches: -rlOtcv --delete
          path: public/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
          #remote_path: /var/www/vhosts/office
          #remote_host: hlc1.ilas.nagoya-u.ac.jp
          #remote_port: 10022
          #remote_user: of-admin

