name: Netlify-Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.github/**'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
  
# 以下，jobs の定義
jobs:
  # 「build」という名前のジョブを定義
  build:
    # ubunts の最新版を指定
    runs-on: ubuntu-latest

    # 実行する処理やコマンドを指定
    steps:
      # レポジトリからの checkout を実行
      - uses: actions/checkout@v4
      #      - uses: enriikke/gatsby-gh-pages-action@v2
      #        with:
      #          access-token: ${{ secrets.ACCESS_TOKEN }}
      #          gatsby-args: --prefix-paths
      # Node のセットアップ
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          # node-version: "latest"
          # node-version: "22.4.1"
          node-version-file: 'package.json'
          # cache: "yarn"
          cache: "npm"
      # Node の実行（npm install, npm run build）
      - name: Build Project
        run: |
          # yarn install
          # yarn run build
          npm install
          npm run build
      # 確認のためのリスト表示　必要なければ削除
      - name: List output files
        run: ls -laFG
        
        env:
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}

      # rsync 
      - name: rsync deployments to hlc1
        uses: burnett01/rsync-deployments@5.2.1
        with:
          # 「switches: -avzr --delete」だと、実行はできても戻り値がエラーになる。
          # １．--omit-dir-timesで「failed to set times onエラー」は防止可。
          # ２．-aオプションは-rlptgoDと等価、うちpgoDがWEBサーバのオーナ設定によっては問題になる。 
          switches: -rlOtcv --delete --exclude=".htaccess"
          path: public/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      # Netlifyにデプロイ。「--prod」を付けないとプレビューDeployになるので注意。
      - name: deployments to Netlify
        run: npx netlify-cli deploy --prod --dir=./public
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
